<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Three-tier architecture</title><desc id="d">Three boxes in sequence labeled presentation layer, application layer, and data layer, joined by arrows.</desc><rect width="1000" height="320" rx="20" fill="#edf5ff"/><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="38" y="86" width="255" height="146" rx="16" fill="#163e65"/><rect x="373" y="86" width="255" height="146" rx="16" fill="#1c649f"/><rect x="708" y="86" width="255" height="146" rx="16" fill="#167b86"/><g fill="white"><text x="165" y="148" font-size="25" font-weight="bold">Presentation</text><text x="165" y="181" font-size="19">Browser / user interface</text><text x="501" y="148" font-size="25" font-weight="bold">Application</text><text x="501" y="181" font-size="19">Business logic / APIs</text><text x="836" y="148" font-size="25" font-weight="bold">Data</text><text x="836" y="181" font-size="19">Database / storage</text></g></g><g stroke="#1474b2" stroke-width="8" fill="none" stroke-linecap="round"><path d="M302 159H360m-16 -13l16 13-16 13"/><path d="M637 159H696m-16 -13l16 13-16 13"/></g></svg>